    <div class="container my-5">
        <h1 class="mb-4 text-center text-primary">Carreras</h1>
 <!-- Formulario para registrar una nueva carrera -->
        <section class="form-section p-4 shadow-sm rounded">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ingrese el nombre de la carrera">
            </div>

            <div class="mb-3">
                <label for="codigo" class="form-label">Código de ID</label>
                <input type="text" id="codigo" class="form-control" placeholder="Ingrese el código de la carrera">
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label">Categoría</label>
                <select id="categoria" class="form-select">
                    <option selected disabled>Seleccione una categoría</option>
                    <option>Ciencias Económicas</option>
                    <option>Ciencias Sociales</option>
                    <option>Ciencias Naturales</option>
                    <option>Ciencias Exactas</option>
                    <option>Informática</option>
                    <option>Medicina</option>
                    <option>Filosofía</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="duracion" class="form-label">Duración</label>
                <input type="text" id="duracion" class="form-control" placeholder="Ej: 4 años">
            </div>

            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select id="tipo" class="form-select">
                    <option selected disabled>Seleccione un tipo</option>
                    <option>Licenciatura</option>
                    <option>Tecnicatura</option>
                    <option>Grado</option>
                    <option>Doctorado</option>
                    <option>Profesorado</option>
                </select>
            </div>

           <button type="button" class="btn btn-primary mt-3" id="btnGuardar">Guardar Carrera</button>
<!-- Campos para nombre, código, categoría, duración y tipo -->
        <!-- El botón dispara la función guardarCarrera() -->
        </section>
          <!-- Sección para eliminar carrera por ID -->
<section class="form-section p-4 shadow-sm rounded mt-4 bg-white">
    <h2 class="mb-3 text-dark">Eliminar Carrera por ID</h2>
    <div class="mb-3">
        <label for="eliminarCarreraId" class="form-label">ID de la carrera</label>
        <input type="number" id="eliminarCarreraId" class="form-control" placeholder="Ingrese el ID de la carrera">
    </div>
    <button type="button" class="btn btn-danger" id="btnEliminarCarrera">Eliminar Carrera</button>
    <!-- Campo de ID + botón que ejecuta eliminarCarrera() -->
</section>

<!-- Filtro por carrera -->
<section class="form-section p-4 shadow-sm rounded mt-4">
    <h2 class="mb-3 text-dark">Filtrar Carrera</h2>
    <div class="mb-3">
        <label for="careerFilter" class="form-label">Carrera</label>
        <input type="text" id="careerFilter" class="form-control" placeholder="Carrera">
        <div class="form-text text-danger" id="careerError" style="display: none;">Ingresá una carrera válida.</div>
    </div>
    <button type="button" class="btn btn-secondary" id="btnFiltrar">Filtrar Carrera</button>
        <!-- Campo de texto para nombre de carrera -->
        <!-- Botón de filtrado + mensaje de error -->
</section>

 <!-- Scripts para Bootstrap, alertas y lógica JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="app.js"></script>


</body>
